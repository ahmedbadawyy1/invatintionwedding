<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>أحمد وتقي — ٣ / ٨ / ٢٠٢٦ — جامع الفردوس</title>
  <style>
    @font-face {
      font-family: "Scheherazade New";
      src: url("fonts/ScheherazadeNew-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "Amiri";
      src: url("fonts/Amiri-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "Cairo";
      src: url("fonts/Cairo.ttf") format("truetype");
      font-weight: 500;
    }
    :root { --burgundy: #7A2E3A; --cream: #EDE7DE; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: var(--cream); }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(110, 95, 75, 0.14) 1px, transparent 0),
        linear-gradient(170deg, #f3eee6 0%, #ebe4d8 55%, #e5ddd2 100%);
      background-size: 3px 3px, 100% 100%;
    }
    .card {
      width: min(100%, 1000px);
      aspect-ratio: 5 / 7;
      position: relative;
      overflow: hidden;
      background: #fff;
      box-shadow:
        0 2px 6px rgba(70, 55, 40, 0.08),
        10px 18px 40px rgba(60, 45, 30, 0.18);
    }
    .card img.photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 42%;
      display: block;
    }
    .text {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: var(--burgundy);
      padding: 6.5% 8% 0;
      text-shadow: 0 1px 10px rgba(255, 252, 248, 0.35);
    }
    .names {
      font-family: "Scheherazade New", "Amiri", serif;
      font-weight: 700;
      font-size: clamp(42px, 7.5vw, 108px);
      line-height: 1.05;
    }
    .date {
      font-family: "Amiri", serif;
      font-weight: 700;
      font-size: clamp(16px, 2.4vw, 34px);
      letter-spacing: 0.12em;
      margin-top: 0.45em;
    }
    .date .nums {
      direction: ltr;
      unicode-bidi: isolate;
      display: inline-block;
    }
    .place {
      font-family: "Cairo", sans-serif;
      font-weight: 500;
      font-size: clamp(13px, 1.7vw, 24px);
      margin-top: 0.4em;
    }
  </style>
</head>
<body>
  <article class="card">
    <img class="photo" src="card-photo-kids-convertible.jpg" alt="" />
    <div class="text">
      <p class="names">أحمد و تقي</p>
      <p class="date">يوم <span class="nums">٣ / ٨ / ٢٠٢٦</span></p>
      <p class="place">في جامع الفردوس بعد العصر</p>
    </div>
  </article>
</body>
</html>
